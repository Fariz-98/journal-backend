apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-api
  namespace: journal-dev
  labels:
    app: journal-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: journal-api
  template:
    metadata:
      labels:
        app: journal-api
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
          - |
            echo "Waiting for mysql:3306..." ;
            until nc -zv mysql 3306 ; do sleep 2 ; done ;
            echo "MySQL reachable."
      containers:
        - name: app
          image: journal-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
            name: http
          env:
          - name: SPRING_DATASOURCE_URL
            value: jdbc:mysql://mysql.journal-dev.svc.cluster.local:3306/journal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: MYSQL_USER
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: MYSQL_PASSWORD
          - name: APPLICATION_JWT_SECRETKEY
            valueFrom:
              secretKeyRef:
                name: app-secret
                key: APPLICATION_JWT_SECRETKEY
          
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          